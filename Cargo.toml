[package]
name = "c4-config"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Load a folder of config files (jsonc/yaml/json/toml/ini/cnf/env/csv/xlsx/ods) into one deep-merged value"
license = "MIT"
repository = "https://github.com/up9cloud/c4"
autoexamples = false

[dependencies]
serde = "1"
serde_json = { version = "1", optional = true }
jsonc-parser = { version = "0.26", optional = true }
yaml_serde = { version = "0.10", optional = true }
toml = { version = "0.8", optional = true }
csv = { version = "1", optional = true }
calamine = { version = "0.36", optional = true }

[lib]
name = "c4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["jsonc"]
json = ["dep:serde_json"]
jsonc = ["dep:jsonc-parser"]
yaml = ["dep:yaml_serde"]
toml = ["dep:toml"]
ini = []
cnf = []
env = []
csv = ["dep:csv"]
excel = ["dep:calamine"]
ods = ["dep:calamine"]
date = []
time = []
ipv4 = []
ipv6 = []
cidr = []
macaddr8 = []
uuid = []
datetime = ["date", "time"]
inet = ["ipv4", "ipv6", "cidr"]
macaddr = ["macaddr8"]
numeric = []
tree = []
cli = [
    "json", "jsonc", "yaml", "toml", "ini", "cnf", "env", "csv",
    "excel", "ods",
    "datetime", "inet", "macaddr", "uuid", "numeric",
]

[[bin]]
name = "c4"
path = "src/main.rs"
required-features = ["cli"]
